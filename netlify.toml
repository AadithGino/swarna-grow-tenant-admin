[build]
  command = "pnpm run build:netlify"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_BASE_URL = "https://api.swarnagrow.com/api/v1"
  NEXT_PUBLIC_USE_MOCKS = "false"

# Deep-link fallback so client routes do not 404 on refresh / direct open.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
