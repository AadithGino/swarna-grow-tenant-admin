[build]
  command = "pnpm run build:netlify"
  publish = "netlify-dist"

# Trailing-slash pretty URLs turn /login into /login/ and retrigger auth redirects.
[build.processing.html]
  pretty_urls = false

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_BASE_URL = "https://api.swarnagrow.com/api/v1"
  NEXT_PUBLIC_USE_MOCKS = "false"
  NEXT_PUBLIC_FLUTTER_PAYMENT_RETURN_URL = "https://swarnagrowv1.netlify.app/payment-return"
  NEXT_PUBLIC_FLUTTER_APP_DEEP_LINK = "evoluxe://payment-return"

# Deep-link fallback so client routes do not 404 on refresh / direct open.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
